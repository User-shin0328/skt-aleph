<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나만의 앱 만들기 발표자료 (2슬라이드) - CertiFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    * {
      font-family: 'Pretendard', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      word-break: keep-all;
    }
    .slide-aspect {
      aspect-ratio: 16 / 9;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-3 sm:p-6 select-none">

  <!-- 프레젠테이션 상단 제어 바 -->
  <header class="w-full max-w-6xl mb-3 flex items-center justify-between px-2">
    <div class="flex items-center gap-2.5">
      <span class="text-xl">📊</span>
      <div>
        <h1 class="text-sm sm:text-base font-extrabold text-white">나만의 앱 만들기 발표자료</h1>
        <p class="text-xs text-zinc-400 font-mono">수험생 맞춤형 자격증 시험 스케줄링 SaaS (CertiFlow)</p>
      </div>
    </div>

    <!-- 슬라이드 번호 및 전환 컨트롤 -->
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-1.5 flex items-center gap-1.5 text-xs font-mono">
        <span class="text-zinc-500">SLIDE</span>
        <span id="slideIndicator" class="font-extrabold text-blue-400 text-sm">1</span>
        <span class="text-zinc-600">/</span>
        <span class="text-zinc-400">2</span>
      </div>

      <button onclick="prevSlide()" class="px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 text-white text-xs font-bold transition-all shadow-xs" title="이전 슬라이드 (← 키)">
        ◀ 이전
      </button>
      <button onclick="nextSlide()" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition-all shadow-sm shadow-blue-600/30" title="다음 슬라이드 (→ 키)">
        다음 ▶
      </button>

      <a href="나만의앱만들기_발표자료.pptx" download="나만의앱만들기_발표자료.pptx" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold transition-all shadow-sm shadow-emerald-600/30" title="파워포인트 PPTX 원본 파일 다운로드">
        <span>📥</span>
        <span>PPTX 다운로드</span>
      </a>
    </div>
  </header>

  <!-- 슬라이드 뷰포트 (16:9 와이드스크린 규격) -->
  <main class="w-full max-w-6xl slide-aspect bg-white text-zinc-900 rounded-2xl shadow-2xl overflow-hidden relative border border-zinc-800 flex flex-col">

    <!-- [슬라이드 1] 프로젝트 개요 및 기술 스택 -->
    <section id="slide1" class="w-full h-full relative cursor-pointer" onclick="nextSlide()" title="클릭 시 다음 슬라이드로 이동">
      <img src="slide1_preview.png" alt="슬라이드 1 - 프로젝트 개요 및 기술 스택" class="w-full h-full object-contain" />
    </section>

    <!-- [슬라이드 2] 화면 구성 및 화살표 기능 설명 -->
    <section id="slide2" class="w-full h-full relative hidden cursor-pointer" onclick="prevSlide()" title="클릭 시 이전 슬라이드로 이동">
      <img src="slide2_preview.png" alt="슬라이드 2 - 실제 서비스 화면 및 주요 기능 안내" class="w-full h-full object-contain" />
    </section>

  </main>

  <!-- 키보드 안내 및 링크 -->
  <footer class="mt-3 text-xs text-zinc-500 font-mono flex flex-wrap items-center justify-between w-full max-w-6xl px-2">
    <span>💡 키보드 좌우 방향키(← / →) 또는 화면을 클릭하여 슬라이드를 넘길 수 있습니다.</span>
    <div class="flex items-center gap-3">
      <a href="certiflow.html" target="_blank" class="text-blue-400 hover:underline">앱 바로가기 ➔</a>
      <span>•</span>
      <a href="https://github.com/User-shin0328/skt-aleph" target="_blank" class="text-zinc-400 hover:underline">GitHub 저장소 ➔</a>
    </div>
  </footer>

  <script>
    let currentSlide = 1;
    const totalSlides = 2;

    function showSlide(num) {
      currentSlide = num;
      document.getElementById('slide1').classList.toggle('hidden', currentSlide !== 1);
      document.getElementById('slide2').classList.toggle('hidden', currentSlide !== 2);
      document.getElementById('slideIndicator').textContent = currentSlide;
    }

    function prevSlide() {
      if (currentSlide > 1) {
        showSlide(currentSlide - 1);
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        showSlide(currentSlide + 1);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide();
      }
    });
  </script>

</body>
</html>
