<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나를 소개하는 한 페이지 - T01</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 40px 20px; line-height: 1.6; }
    .container { max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h1 { font-size: 1.75rem; margin-bottom: 8px; color: #0f172a; }
    .subtitle { color: #64748b; margin-bottom: 24px; font-weight: 500; }
    .section { margin-bottom: 28px; }
    .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; color: #334155; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; }
    .input-group { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    button { background: #2563eb; color: #ffffff; border: none; padding: 10px 18px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    li { background: #f1f5f9; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; word-break: break-all; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 나를 소개하는 섹션 (T01 핵심) -->
    <h1>반갑습니다, 성장하는 개발자입니다</h1>
    <p class="subtitle">ALEPH 바이브코딩 과정 | 실천을 통해 배우는 여정</p>

    <div class="section">
      <div class="section-title">관심 분야 & 목표</div>
      <p>AI 도구를 활용해 문제를 빠르게 정의하고, 실제 배포 가능한 소프트웨어를 만드는 데 집중하고 있습니다. 꾸준한 리추얼과 기록을 통해 매일 더 나은 개발 습관을 만들어갑니다.</p>
    </div>

    <div class="section">
      <div class="section-title">주요 키워드</div>
      <div class="tags">
        <span class="tag">#문제해결</span>
        <span class="tag">#AI바이브코딩</span>
        <span class="tag">#지속적인학습</span>
        <span class="tag">#Vercel배포</span>
      </div>
    </div>

    <!-- 2. 동작 검증용 한 줄 방명록 (Supabase 연동) -->
    <div class="section">
      <div class="section-title">한 줄 응원 남기기</div>
      <div class="input-group">
        <input type="text" id="contentInput" placeholder="응원의 한 마디를 입력하세요">
        <button id="saveBtn">등록</button>
      </div>
      <ul id="list"></ul>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nolhrriuxhuhgduekyae.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_YRJgWCiyxTxGvM81uZZu-w_66OxefD8';
    const TABLE_NAME = 'bankhar0328';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const saveBtn = document.getElementById('saveBtn');
    const contentInput = document.getElementById('contentInput');
    const list = document.getElementById('list');

    // 한 줄 등록
    saveBtn.addEventListener('click', async () => {
      const text = contentInput.value.trim();
      if (!text) {
        alert('내용을 입력해주세요.');
        return;
      }

      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .insert([{ name: text }]);

      if (error) {
        console.error('저장 실패:', error);
        alert('저장 실패: ' + error.message);
      } else {
        alert('응원이 등록되었습니다!');
        contentInput.value = '';
        loadData();
      }
    });

    // 목록 불러오기
    async function loadData() {
      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('조회 실패:', error);
        return;
      }

      list.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.textContent = item.name || JSON.stringify(item);
        list.appendChild(li);
      });
    }

    loadData();
  </script>
</body>
</html>
