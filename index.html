<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase 데이터 연동</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    input { width: 70%; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 15px; cursor: pointer; }
    ul { margin-top: 20px; padding-left: 20px; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>

  <h2>데이터 기록 테스트</h2>
  <div>
    <input type="text" id="contentInput" placeholder="기록할 내용을 입력하세요">
    <button id="saveBtn">저장하기</button>
  </div>

  <h3>저장된 목록</h3>
  <ul id="list"></ul>

  <script>
    const SUPABASE_URL = 'https://nolhrriuxhuhgduekyae.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_YRJgWCiyxTxGvM81uZZu-w_66OxefD8';
    const TABLE_NAME = 'bankhar0328';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const saveBtn = document.getElementById('saveBtn');
    const contentInput = document.getElementById('contentInput');
    const list = document.getElementById('list');

    // 1. 데이터 저장 (실제 확인된 컬럼명인 'name' 사용)
    saveBtn.addEventListener('click', async () => {
      const text = contentInput.value.trim();
      if (!text) {
        alert('내용을 입력해주세요.');
        return;
      }

      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .insert([{ name: text }]);

      if (error) {
        console.error('저장 실패 상세:', error);
        alert('저장 실패: ' + error.message);
      } else {
        alert('성공적으로 저장되었습니다!');
        contentInput.value = '';
        loadData();
      }
    });

    // 2. 데이터 조회
    async function loadData() {
      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('조회 실패 상세:', error);
        return;
      }

      list.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        // 저장된 name 값 출력
        li.textContent = item.name || JSON.stringify(item);
        list.appendChild(li);
      });
    }

    // 초기 화면 로드 시 실행
    loadData();
  </script>
</body>
</html>
