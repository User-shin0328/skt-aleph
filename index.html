<script>
  const SUPABASE_URL = 'https://nolhrriuxhuhgduekyae.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_YRJgWCiyxTxGvM81uZZu-w_66OxefD8';

  // 변수명을 supabase -> supabaseClient 로 변경
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const TABLE_NAME = 'bankhar0328';

  const saveBtn = document.getElementById('saveBtn');
  const contentInput = document.getElementById('contentInput');
  const list = document.getElementById('list');

  // 데이터 저장
  saveBtn.addEventListener('click', async () => {
    const text = contentInput.value.trim();
    if (!text) {
      alert('내용을 입력해주세요.');
      return;
    }

    // supabaseClient 사용
    const { data, error } = await supabaseClient
      .from(TABLE_NAME)
      .insert([{ content: text }]);

    if (error) {
      console.error('저장 실패 상세:', error);
      alert('저장 실패: ' + error.message);
    } else {
      alert('성공적으로 저장되었습니다!');
      contentInput.value = '';
      loadData();
    }
  });

  // 데이터 조회
  async function loadData() {
    // supabaseClient 사용
    const { data, error } = await supabaseClient
      .from(TABLE_NAME)
      .select('*');

    if (error) {
      console.error('조회 실패 상세:', error);
      return;
    }

    list.innerHTML = '';
    data.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item.content || JSON.stringify(item);
      list.appendChild(li);
    });
  }

  loadData();
</script>
